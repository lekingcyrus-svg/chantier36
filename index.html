<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chantier360</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F1F5F9;--card:#fff;--ink:#0F172A;--mute:#64748B;--line:#E2E8F0;--acc:#0284C7;--onacc:#fff;--soft:#E0F2FE;--ok:#15803D;--ko:#DC2626;--mid:#D97706;--head:#0C4A6E;--head2:#312E81;--onhead:#fff;--f:"Plus Jakarta Sans",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F172A;--card:#1E293B;--ink:#E2E8F0;--mute:#94A3B8;--line:#334155;--acc:#38BDF8;--onacc:#06223A;--soft:#0C4A6E;--head:#020617;--head2:#1E293B;--ok:#4ADE80;--ko:#F87171;--mid:#FBBF24}}
:root[data-theme="dark"]{--bg:#0F172A;--card:#1E293B;--ink:#E2E8F0;--mute:#94A3B8;--line:#334155;--acc:#38BDF8;--onacc:#06223A;--soft:#0C4A6E;--head:#020617;--head2:#1E293B;--ok:#4ADE80;--ko:#F87171;--mid:#FBBF24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:10}
header{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,var(--head),var(--head2));color:var(--onhead);padding:14px 16px 16px;border-radius:0 0 26px 26px;font:800 20px var(--f);letter-spacing:-.02em}
header button{background:rgba(255,255,255,.14);border:0;color:var(--onhead);border-radius:50%;width:34px;height:34px;padding:0;display:grid;place-items:center;line-height:0;cursor:pointer}
.stripe{display:none}
#app{max-width:520px;margin:0 auto;padding:14px 14px 104px}
h1{font:800 26px var(--f);letter-spacing:-.03em;margin:8px 0}
h2{font:700 16px var(--f);letter-spacing:-.01em;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
label{display:block;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:12px 0 0;flex:1}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:500 15px var(--f);text-transform:none;letter-spacing:0}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{display:inline-block;width:20px;height:20px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--acc)}
.chk{display:flex;align-items:center}
.row{display:flex;gap:10px;align-items:flex-end}
.btn{display:block;width:100%;text-align:center;padding:14px;border:0;border-radius:14px;background:var(--acc);color:var(--onacc);font:700 15px var(--f);margin-top:12px;cursor:pointer;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.h{font-size:12px;color:var(--mute);margin:6px 0 0}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph img{width:76px;height:76px;object-fit:cover;border-radius:14px}
.tk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:10px 0}.tk input{grid-column:1/3}
.tk b{font-variant-numeric:tabular-nums}
canvas{width:100%;height:auto;border-radius:14px;margin-top:10px;touch-action:none}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{border:0;border-radius:99px;padding:5px 14px;font:700 12px var(--f);color:#fff}
.s0{background:var(--ko)}.s1{background:var(--mid)}.s2{background:var(--ok)}
.rp{width:100%;border-radius:14px;margin:8px 0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;padding:10px;border:0;border-radius:11px;background:none;color:var(--mute);font:700 14px var(--f);cursor:pointer}.seg .on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(15,23,42,.15)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.t th,.t td{padding:5px 3px;text-align:left;border-bottom:1px solid var(--line)}
.t td input{margin:0;padding:7px 6px;min-width:56px;border-radius:9px}.t td:first-child input{min-width:130px}
.t td button{background:none;border:0;color:var(--ko);font-size:18px}
.tot{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.tot b{font-variant-numeric:tabular-nums}.tot input{width:90px;margin:0;text-align:right}
.big{font:800 24px var(--f);letter-spacing:-.02em}
.warn{border-left:4px solid var(--ko);padding:9px 12px;font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--ko) 10%,transparent);border-radius:0 12px 12px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:4px 0;font:600 11px var(--f);cursor:pointer}
nav button svg,.chips button svg{display:block;margin:0 auto 3px}.btn svg{vertical-align:-6px;margin-right:8px}
nav button.on{color:var(--acc)}
nav button.on svg{background:var(--soft);box-sizing:content-box;padding:5px 14px;border-radius:12px;margin-bottom:2px}
#ov{display:none;position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 30px}
#ov .doc{max-width:700px;margin:0 auto}
#ov dl{margin:0}#ov dt{font-weight:700;margin-top:10px}#ov dd{margin:2px 0}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--onhead);padding:10px 18px;border-radius:99px;z-index:50;display:none;font-weight:600;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.chips button{padding:9px 2px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:600 13px var(--f);cursor:pointer}.chips .on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ok{color:var(--ok)}.bad{color:var(--mid)}
.err{display:none;color:var(--ko);font-weight:600;background:color-mix(in srgb,var(--ko) 10%,transparent);border-left:4px solid var(--ko);padding:9px 12px;border-radius:0 12px 12px 0;margin:10px 0 0;font-size:13px}
.btn.dng{background:var(--ko);color:#fff;margin-top:10px;box-shadow:none}
#lg{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,var(--head),var(--head2))}
.lgc{width:100%;max-width:400px;margin:auto;background:var(--card);border-radius:28px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.lgi{display:block;margin:0 auto;border-radius:22px}
.lock header,.lock .stripe,.lock #app,.lock nav{display:none}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:2px 0 8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}.bar.ko i{background:var(--ko)}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;overflow:visible;background:#fff;color:#000;padding:0;display:block}.noprint{display:none}}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0C4A6E"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body class="lock">
<header><span>Chantier360</span><span style="display:flex;gap:8px"><button onclick="aide()" aria-label="Aide"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/></svg></button><button onclick="tg()" aria-label="Changer de thème"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button><button onclick="reg()" aria-label="Réglages"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></span></header>
<div class="stripe"></div>
<div id="tr" style="max-width:520px;margin:0 auto;padding:0 14px"></div>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<div id="ov"></div>
<div id="toast" role="status"></div>
<div id="lg" role="dialog" aria-modal="true" aria-label="Identification"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={reps:{},tasks:[{n:'Terrassement',p:0},{n:'Fondations',p:0},{n:'Élévation',p:0}],res:[],met:[],k:1.25,tva:18,theme:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('c360')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('c360',JSON.stringify(S))}catch(e){msg('Stockage plein : supprimez des photos.')}}
const today=()=>new Date().toISOString().slice(0,10),f=(n,d=2)=>(Math.round(n*10**d)/10**d).toLocaleString('fr-FR');
let tab='ch',D=today(),sub='calc',kind='beton',LN=[],ph=0;
const R=()=>S.reps[D]||(S.reps[D]={meteo:'Ensoleillé',intemp:false,heures:0,eff:0,travaux:'',incid:'',photos:[]});
const LOTS=['Terrassement','Gros œuvre','Maçonnerie','Étanchéité','Plomberie','Électricité','Menuiserie','Peinture','VRD'],ST=['Ouverte','En cours','Levée'];
function msg(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',2600)}
function theme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
function tg(){S.theme=document.documentElement.dataset.theme==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme:dark)').matches)?'light':'dark';theme();save()}
const IC={"ch": "<path d=\"M4 15a8 8 0 0 1 16 0\"/><path d=\"M2.5 15h19v3h-19z\"/><path d=\"M12 7v4\"/>", "re": "<path d=\"M5 21V4\"/><path d=\"M5 4h11l-2 4 2 4H5\"/>", "me": "<rect x=\"2.5\" y=\"8\" width=\"19\" height=\"8\" rx=\"1.5\"/><path d=\"M6 8v3M10 8v4M14 8v3M18 8v4\"/>", "ca": "<rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\"/><path d=\"M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01\"/>", "st": "<path d=\"M3 5h18\"/><path d=\"M6 5v15M18 5v15\"/><path d=\"M3 20h18\"/>", "es": "<path d=\"M3 20h5v-5h5v-5h5V5h3\"/>", "bl": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"/><path d=\"M3 12h18M9 5v7M15 12v7\"/>", "fo": "<path d=\"M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z\"/><path d=\"M4 8l2-4h12l2 4\"/><path d=\"M8 14c1.5-1 2.5 1 4 0s2.5-1 4 0\"/>", "su": "<rect x=\"5\" y=\"5\" width=\"14\" height=\"14\" rx=\"1\"/><path d=\"M2 5v14M22 5v14\"/>", "cam": "<path d=\"M4 8h3l2-3h6l2 3h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/>", "help": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7\"/><path d=\"M12 17h.01\"/>", "theme": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 3a9 9 0 0 1 0 18z\" fill=\"currentColor\"/>"},ic=(n,z=24)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const T=[['ch','ch','Chantier'],['pn','pn','Planning'],['re','re','Réserves'],['me','me','Métrés'],['ca','ca','Calculs']];
function go(t){tab=t;render()}
function render0(){$('#nav').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${ic(t[1])}${t[2]}</button>`).join('');({ch,pn:pnv,re,me,ca}[tab])();scrollTo(0,0)}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.55),c)};im.src=r.result};r.readAsDataURL(file)}

/* Chantier */
function ch(){const r=R();
$('#app').innerHTML=`<h1>Chantier</h1>${dash()}<div class="card"><label>Date du rapport<input type="date" value="${D}" onchange="D=this.value||today();ch()"></label>
<div class="row"><label>Météo<select onchange="R().meteo=this.value;save()">${['Ensoleillé','Nuageux','Pluie','Vent fort','Gel','Canicule'].map(m=>`<option ${m===r.meteo?'selected':''}>${m}</option>`).join('')}</select></label>
<label>Effectifs<input type="number" inputmode="numeric" min="0" value="${r.eff}" oninput="R().eff=+this.value;save()"></label></div>
<label class="chk"><input type="checkbox" ${r.intemp?'checked':''} onchange="R().intemp=this.checked;save()">Intempérie : travaux arrêtés</label>
<label>Heures perdues<input type="number" inputmode="decimal" min="0" step="0.5" value="${r.heures}" oninput="R().heures=+this.value;save()"></label>
<label>Travaux réalisés<textarea rows="3" oninput="R().travaux=this.value;save()">${esc(r.travaux)}</textarea></label>
<label>Incidents et observations<textarea rows="2" oninput="R().incid=this.value;save()">${esc(r.incid)}</textarea></label>
<label class="btn sec">${ic('cam',20)}Ajouter des photos<input type="file" accept="image/*" capture="environment" multiple hidden onchange="addPh(this)"></label>
<div class="ph">${r.photos.map((p,i)=>`<img src="${phUrl(p)}" alt="Photo ${i+1}" onclick="delPh(${i})">`).join('')}</div>${r.photos.length?'<p class="h">Touchez une photo pour la supprimer.</p>':''}</div>
<h2>Avancement</h2><div class="card">${S.tasks.map((t,i)=>`<div class="tk"><span>${esc(t.n)}${plTag(t)}</span><b id="p${i}">${t.p} %</b><input type="range" min="0" max="100" step="5" value="${t.p}" aria-label="Avancement ${esc(t.n)}" oninput="S.tasks[${i}].p=+this.value;$('#p${i}').textContent=this.value+' %';S.tasks[${i}].u=D;save()"></div>`).join('')}
<div class="row"><label>Nouvelle tâche<input id="nt"></label><button class="btn sec" style="width:auto;padding:11px 16px" onclick="addT()">Ajouter</button></div></div>
<button class="btn" onclick="rapport()">Générer le rapport du jour</button>`}
function addPh(el){[...el.files].forEach(f=>shrink(f,d=>{R().photos.push(phRef(d));save();if(tab==='ch')ch()}))}
function delPh(i){R().photos.splice(i,1);save();ch()}
function addT(){const v=$('#nt').value.trim();if(v){S.tasks.push({n:v,p:0});save();ch()}}
function ov(h){$('#ov').innerHTML=`<div class="doc"><div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="doPrint()">Imprimer</button><button class="btn" onclick="sharePdf()">PDF / Partager</button><button class="btn sec" onclick="$('#ov').style.display='none'">Fermer</button></div>${S.ent||S.chan?`<p class="h"><b>${esc(S.ent||'')}</b> ${esc(S.chan||'')}</p>`:''}${h}</div>`;$('#ov').style.display='block'}
function rapport(){const r=R(),op=S.res.filter(x=>x.st!=='Levée');
ov(`<h1>Rapport journalier</h1><p>${new Date(D+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><dl><dt>Météo</dt><dd>${r.meteo}${r.intemp?`, intempérie : ${r.heures} h perdues`:''}</dd><dt>Effectifs</dt><dd>${r.eff} personne(s)</dd><dt>Travaux réalisés</dt><dd>${esc(r.travaux)||'Non renseigné'}</dd><dt>Incidents et observations</dt><dd>${esc(r.incid)||'Aucun'}</dd>
<dt>Avancement</dt><dd>${S.tasks.map(t=>`${esc(t.n)} : ${t.p} %${plTxt(t)}`).join('<br>')}</dd><dt>Réserves non levées</dt><dd>${op.length?op.map(x=>`RES-${String(x.id).padStart(3,'0')} ${esc(x.lot)} : ${esc(x.desc)}`).join('<br>'):'Aucune'}</dd></dl><div class="ph">${r.photos.map(p=>`<img src="${phUrl(p)}" alt="">`).join('')}</div>`)}

/* Réserves */
function re(){ph=0;
$('#app').innerHTML=`<h1>Réserves</h1><div class="card"><label class="btn sec" style="margin-top:0">${ic('cam',20)}Photo du défaut<input type="file" accept="image/*" capture="environment" hidden onchange="rph(this)"></label><canvas id="cv" hidden></canvas><p class="h" id="hint" hidden>Entourez le défaut au doigt.</p>
<div class="row"><label>Lot<select id="rl">${LOTS.map(l=>`<option>${l}</option>`).join('')}</select></label><label>Responsable<input id="rr" placeholder="Entreprise"></label></div>
<label>Description<textarea id="rd" rows="2"></textarea></label><button class="btn" onclick="saveR()">Enregistrer la réserve</button><p class="h">La position GPS est ajoutée si vous l’autorisez.</p></div>
<h2>${S.res.length} réserve(s), ${S.res.filter(x=>x.st!=='Levée').length} à lever</h2>${S.res.length?'':'<p class="h">Aucune réserve. Prenez une photo pour en créer une.</p>'}`+
S.res.map((x,i)=>`<div class="card"><div class="top"><b>RES-${String(x.id).padStart(3,'0')}</b><button class="tag s${ST.indexOf(x.st)}" onclick="cyc(${i})" aria-label="Changer le statut">${x.st}</button></div>${x.photo?`<img class="rp" src="${phUrl(x.photo)}" alt="Photo de la réserve">`:''}<p style="margin:4px 0">${esc(x.desc)}</p><p class="h">${esc(x.lot)}, ${esc(x.resp||'responsable non défini')}, ${x.date}${x.gps?`, GPS ${x.gps}`:''}</p></div>`).reverse().join('')}
function rph(el){const fl=el.files[0];if(!fl)return;shrink(fl,(d,s)=>{const c=$('#cv');c.width=s.width;c.height=s.height;const x=c.getContext('2d');x.drawImage(s,0,0);c.hidden=false;$('#hint').hidden=false;ph=1;let dr=0;x.strokeStyle='#E53935';x.lineWidth=Math.max(4,c.width/70);x.lineCap='round';
const p=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
c.onpointerdown=e=>{dr=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};c.onpointermove=e=>{if(dr){x.lineTo(...p(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>dr=0})}
function saveR(){const x={id:S.res.reduce((m,r)=>Math.max(m,r.id),0)+1,desc:$('#rd').value.trim(),lot:$('#rl').value,resp:$('#rr').value.trim(),st:'Ouverte',date:today(),photo:ph?phRef($('#cv').toDataURL('image/jpeg',.6)):'',gps:''};
if(!x.desc&&!x.photo){msg('Ajoutez une photo ou une description.');return}
S.res.push(x);save();re();
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{x.gps=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);save();if(tab==='re')re()},()=>{},{timeout:5000})}
function cyc(i){S.res[i].st=ST[(ST.indexOf(S.res[i].st)+1)%3];save();re()}

/* Métrés et DPGF */
const EL={Semelle:80,Longrine:90,Poteau:200,Poutre:150,Dalle:100,Voile:90},NV=id=>{const e=$('#'+id);return e?(+e.value||0):0};
function me(){$('#app').innerHTML=`<h1>Métrés et DPGF</h1><div class="seg"><button class="${sub==='calc'?'on':''}" onclick="sub='calc';me()">Calculer</button><button class="${sub==='dp'?'on':''}" onclick="sub='dp';me()">DPGF (${S.met.length})</button></div><div id="sv"></div>`;sub==='calc'?calcV():dpgf()}

function cc2(){const L=NV('cl'),iso=$('#ca').value==='i',hd=c5(L/(iso?25:30)),hp=c5(L/(iso?12:16)),bp=Math.max(.2,c5(.4*hp));

function plD(){const el=$('#pld'),L=S.plans||[];if(!el)return;if(!L.length){el.innerHTML='';return}

let PM=today().slice(0,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),pdt=s=>new Date(s+'T12:00:00'),fd=s=>s?s.split('-').reverse().join('/'):'',isW=d=>S.dim||d.getDay()!==0;

function opb(){const R=pbCalc();PBR=R;if(R.err){$('#ox').innerHTML=`<p class="warn">${R.err}</p>`;return}const F=(x,k)=>f(x,k==null?2:k);
$('#ox').innerHTML=`<div style="margin-top:12px">${R.sec.map(s=>`<div class="tot"><span><b>${s.n}</b> : Mu = ${F(s.Mu,1)} kN·m</span><b>${s.bars.n} HA${s.bars.d}${s.bars.lits>1?' (2 lits)':''}</b></div><p class="h" style="margin:0 0 6px">As = ${F(s.Asr)} cm²${s.Asp>0?' ; acier comprimé '+F(s.Asp)+' cm²':''} ; ${s.top?'partie haute':'partie basse'}</p>`).join('')}
<div class="tot"><span><b>Cadres</b> : HA${R.Dc*1000}, ${R.nb} brins</span><b>e = ${R.sh.st} cm</b></div><p class="h" style="margin:0 0 6px">Premier cadre à ${F(R.sh.st/2,1)} cm de l’appui ; τu = ${F(R.sh.tu)} MPa</p>
${R.chk.map(x=>`<p class="h ${x.ok?'ok':'bad'}" style="margin:3px 0">${x.ok?'✓':'⚠'} ${x.t}</p>`).join('')}${R.warn.map(w=>`<p class="h bad" style="margin:3px 0">⚠ ${w}</p>`).join('')}
<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Détail du calcul, formules et références</summary>${R.steps.map(s=>`<p class="h" style="margin:6px 0"><b>${s[0]}</b><br>${s[1]}<br><b>${s[2]}</b> <span class="h">${s[3]?'('+s[3]+')':''}</span></p>`).join('')}</details></div>
<button class="btn" onclick="pbPdf()">Note de calcul en PDF</button><button class="btn sec" onclick="pbPlan()">Utiliser dans le plan de la poutre</button>`}
function pbPdf(){if(!PBR||PBR.err){msg('Corrigez les données.');return}shareFile('Note-de-calcul-poutre-'+ymd()+'.pdf','application/pdf',buildPdf(pbNote(PBR)),'Note de calcul')}
function pbPlan(){const R=PBR;if(!R||R.err){msg('Corrigez les données.');return}const p=PL().pou,bot=R.sec.filter(s=>!s.top),top=R.sec.filter(s=>s.top),bm=bot.reduce((a,s)=>s.bars.Ap>a.bars.Ap?s:a,bot[0]);
Object.assign(p,{typ:R.T==='con'?'con':'iso',b:Math.round(R.b*100),h:Math.round(R.h*100),c:Math.round(R.c*1000)/10,ni:bm.bars.n,di:bm.bars.d,dc:R.Dc*1000,sa:R.sh.st,sc:Math.max(R.sh.st,Math.min(Math.floor(R.sh.st*2),Math.floor(R.sh.stmax)))});
if(R.T==='con'){p.nt=R.sp.length;p.pl=R.sp.join(';');const tm=top.reduce((a,s)=>s.bars.Ap>a.bars.Ap?s:a,top[0]);p.ns=2;p.ds=Math.max(12,Math.min(16,tm.bars.d));const ex=Math.max(0,Math.ceil((tm.Asr-2*Math.PI*p.ds*p.ds/400)/(Math.PI*p.ds*p.ds/400)));p.nch=Math.min(ex,4);p.dch=p.ds}
else{p.L=R.sp[0]||5;p.ns=2;p.ds=12;p.nch=0}
save();logA('Armatures du calcul BAEL transférées vers le plan de poutre');pt='pou';cs='pl';ca();msg('Paramètres transférés : vérifiez le plan.')}

/* ===== Lot 3b : poteau BAEL 91 r99 (flambement B.8.4, flexion composée A.4.4) ===== */
/* b, h, a en m (h = dimension dans le plan de flexion) ; Nu en kN ; Mu en kN.m ; As en cm² */
MC.colCen=(Nu,b,h,lf,m,age,c,Dl)=>{const a=Math.min(b,h),lam=lf*Math.sqrt(12)/a,al0=lam<=50?.85/(1+.2*Math.pow(lam/35,2)):.6*Math.pow(50/lam,2),al=al0/age,Br=(b-.02)*(h-.02),u=2*(b+h),B=b*h,
As=Math.max(0,(Nu/1000/al-Br*m.fc/(.9*m.gb))*m.gs/m.fe)*1e4,Amin=Math.max(4*u,.2*B*100),Amax=5*B*100;return{a,lam,al0,al,Br,u,B,As,Amin,Amax,Asr:Math.max(As,Amin),okL:lam<=70}};
MC.barsPot=(As,b,h,c,dt)=>{let best=null;for(const n of[4,6,8,10,12])for(const d of[12,14,16,20,25]){const ap=n*Math.PI*d*d/400;if(ap<As-1e-9)continue;const cn=ringCnt(b*100,h*100,n),sH=(b*100-2*c*100-2*dt*100-(2+cn.H)*d/10)/(1+cn.H),sV=(h*100-2*c*100-2*dt*100-(2+cn.V)*d/10)/(1+cn.V);if(Math.min(sH,sV)<Math.max(d/10,2.5))continue;const ex=ap-As;if(!best||ex<best.ex-1e-6)best={n,d,ap,ex}}return best};
function pcCalc(){const v=id=>NV(id),mode=$('#xct').value,b=v('xcb')/100,h=v('xch')/100,l0=v('xcl'),k=+$('#xck').value,age=+$('#xca').value,fc=v('xcf'),fe=v('xce'),c=v('xcc')/100,Dl=v('xcd')/1000,Nu0=v('xcN'),Mu0=v('xcM'),pp=+$('#xcw').value?25*b*h*l0:0,Nu=Nu0*1+pp*1.35,m=MC.mat(fc,fe),F=(x,n)=>f(x,n==null?2:n);
if(!(b>.1&&h>.1&&l0>0&&Nu>0))return{err:'Renseignez les dimensions, la hauteur et l’effort normal.'};
const lf=k*l0,R={m,b,h,l0,k,lf,Nu,Nu0,pp,Mu0,mode,age,c,Dl,steps:[],warn:[],chk:[]};
R.steps.push(['Matériaux : fbu','fbu = 0,85·fc28 / (θ·γb)',F(m.fbu)+' MPa','A.4.3,41'],['Matériaux : fsu','fsu = fe / γs',F(m.fsu,1)+' MPa','A.4.3,2']);
if(pp)R.steps.push(['Poids propre du poteau','Npp = 1,35·25·b·h·l0',F(pp*1.35)+' kN (ELU)','']);
R.steps.push(['Longueur de flambement','lf = k·l0 (k = '+k+')',F(lf)+' m','B.8.3,3']);
let Nd=Nu;
if(mode==='fc'){const e0=Mu0/Nu0,ea=Math.max(.02,l0/250),e1=e0+ea,lam0=lf*Math.sqrt(12)/Math.min(b,h);R.steps.push(['Excentricité du premier ordre','e1 = Mu/Nu + ea, ea = max(2 cm ; l0/250)',F(e1*100,1)+' cm','A.4.3,5']);
let e2=0;if(lam0<=Math.max(50,Math.min(67*e1/h,100))){e2=3*lf*lf*(2+1*2)/(1e4*h);R.steps.push(['Excentricité du second ordre','e2 = 3·lf²·(2 + α·φ) / (10⁴·h), α = 1 et φ = 2 (hypothèse sécuritaire)',F(e2*100,1)+' cm','A.4.3,5'])}else{R.warn.push('Élancement trop grand pour la méthode forfaitaire du second ordre : analyse non linéaire nécessaire.')}
const e=e1+e2,d=h-c-.008-Dl/2,dp=c+.008+Dl/2,Mua=Nu*(e+d-h/2),cond=Nu/1000*(d-dp)-Mua/1000,lim=(.337-.81*dp/h)*b*h*h*m.fbu;
R.steps.push(['Excentricité totale','e = e1 + e2',F(e*100,1)+' cm',''],['Moment par rapport aux aciers tendus','Mua = Nu·(e + d − h/2)',F(Mua)+' kN·m','A.4.4,1']);
if(cond<=lim){const x=MC.flex(Mua,b,d,dp,m),Ast=x.As-Nu/1000/m.fsu*1e4;R.steps.push(['Section partiellement comprimée','Nu·(d−d’) − Mua ≤ (0,337 − 0,81·d’/h)·b·h²·fbu',`${F(cond,4)} ≤ ${F(lim,4)} MN·m`,'A.4.4,1'],['Armatures tendues','As = Mua/(z·fsu) − Nu/fsu',F(Ast)+' cm²'+(x.comp?` ; As’ = ${F(x.Asp)} cm²`:''),'A.4.4,1']);R.As1=Math.max(Ast,x.Asp,0);R.partial=true;Nd=null;x.warn.forEach(w=>R.warn.push(w))}
else{Nd=Nu*(1+6*e/h);R.steps.push(['Section entièrement comprimée','Nu·(d−d’) − Mua > (0,337 − 0,81·d’/h)·b·h²·fbu',`${F(cond,4)} > ${F(lim,4)} MN·m`,'A.4.4,2'],['Effort normal équivalent (méthode simplifiée sécuritaire)','Neq = Nu·(1 + 6·e/h), traité en compression centrée',F(Nd)+' kN','—']);R.warn.push('Section entièrement comprimée : le calcul exact (BAEL A.4.4, 2) n’est pas implémenté. Les armatures sont obtenues par la méthode simplifiée Neq = Nu(1 + 6e/h), sécuritaire mais non optimale.')}}
let cc=null;if(Nd!=null){cc=MC.colCen(Nd,b,h,lf,m,age,c,Dl);R.cc=cc;R.steps.push(['Élancement','λ = lf·√12 / a, a = plus petite dimension',F(cc.lam,1),'B.8.4,1'],['Coefficient de flambement','α = 0,85/(1 + 0,2·(λ/35)²) si λ ≤ 50 ; 0,6·(50/λ)² sinon'+(age>1?' ; divisé par '+age:''),F(cc.al,4),'B.8.4,1'],['Section réduite','Br = (a − 2 cm)·(b − 2 cm)',F(cc.Br*1e4,0)+' cm²','B.8.4,1'],['Armatures calculées','As ≥ [Nu/α − Br·fc28/(0,9·γb)]·γs/fe',F(cc.As)+' cm²','B.8.4,1']);if(!cc.okL)R.warn.push('Élancement supérieur à 70 : méthode B.8.4 non applicable, augmenter la section.')}
const B=b*h,u=2*(b+h),Amin=Math.max(4*u,.2*B*100),Amax=5*B*100,Asc=Math.max(R.As1||0,cc?cc.As:0),Asr=Math.max(Asc,Amin);
R.steps.push(['Armatures minimales','Amin = max(4 cm²/m de périmètre ; 0,2 % B)',F(Amin)+' cm²','A.8.1,21'],['Armatures maximales','Amax = 5 % B',F(Amax)+' cm²','A.8.1,22'],['Armatures retenues','As = max(calcul ; Amin)',F(Asr)+' cm²','']);
R.Asr=Asr;R.Amin=Amin;R.Amax=Amax;R.bars=MC.barsPot(Asr,b,h,c,.008);
if(!R.bars){R.warn.push('Aucune combinaison de barres ne tient dans la section : augmenter b ou h.');R.bars={n:12,d:25,ap:12*Math.PI*25*25/400,ex:0,fail:true}}
const Dt=Math.max(6,Math.min(10,Math.ceil(R.bars.d/3/2)*2)),st=Math.floor(Math.min(15*R.bars.d/10,40,Math.min(b,h)*100+10)),ls=R.bars.d/10*fe/(4*.6*2.25*m.ft),lr=Math.ceil(.6*ls);
R.Dt=Dt;R.st=st;R.lr=lr;R.steps.push(['Armatures transversales','Øt ≥ Øl/3 ; st ≤ min(15·Øl ; 40 cm ; a + 10 cm)',`Øt = ${Dt} mm ; st = ${st} cm`,'A.8.1,3'],['Longueur de recouvrement','ls = Ø·fe/(4·τs), τs = 0,6·ψs²·ft28 (ψs = 1,5) ; lr = 0,6·ls',`ls = ${F(ls*10,0)} mm ; lr = ${lr} cm`,'A.6.1,221 / A.6.1,253']);
R.chk.push({ok:Asr<=Amax,t:`Taux d’armatures : ${F(Asr/(B*100),2)} % (maximum 5 %)`},{ok:!R.bars.fail&&R.bars.ap>=Asr-1e-9,t:`Armatures : ${R.bars.n} HA${R.bars.d} = ${F(R.bars.ap)} cm² pour ${F(Asr)} cm² requis`},{ok:(cc?cc.okL:true),t:cc?`Élancement λ = ${F(cc.lam,1)} (limite 70)`:'Élancement : section partiellement comprimée (méthode forfaitaire)'});
return R}
function pcNote(R){const F=(x,n)=>f(x,n==null?2:n),bl=[];
bl.push({t:'h',s:'1. Hypothèses et données'},{t:'p',s:`Référentiel : ${MC.ref}. Moteur de calcul : ${MC.ver}. ${S.chan?'Chantier : '+S.chan+'. ':''}Ouvrage : poteau en béton armé, ${R.mode==='cen'?'compression centrée avec flambement (B.8.4)':'flexion composée (A.4.4)'}.`},{t:'t',rows:[['Section','b × h = '+F(R.b*100,0)+' × '+F(R.h*100,0)+' cm','',''],['Béton / acier','fc28 = '+R.m.fc+' MPa ; fe = '+R.m.fe+' MPa (HA)','',''],['Hauteur et appuis','l0 = '+F(R.l0)+' m ; lf = '+F(R.lf)+' m','',''],['Efforts',`Nu = ${F(R.Nu0)} kN${R.mode==='fc'?' ; Mu = '+F(R.Mu0)+' kN·m':''}${R.pp?' + poids propre':''}`,'',''],['Enrobage','c = '+F(R.c*100,1)+' cm','','']]},{t:'h',s:'2. Calculs étape par étape'},{t:'t',rows:R.steps.map(s=>[s[0],s[1],s[2],s[3]])},{t:'h',s:'3. Vérifications'},...R.chk.map(c=>({t:'p',s:(c.ok?'[OK] ':'[A REVOIR] ')+c.t,c:c.ok?'#1B6E2D':'#C62828',b:!c.ok})));
if(R.warn.length)bl.push({t:'h',s:'4. Avertissements'},...R.warn.map(w=>({t:'p',s:'- '+w})));
bl.push({t:'h',s:'5. Synthèse du ferraillage'},{t:'t',rows:[['Armatures longitudinales',`${R.bars.n} HA${R.bars.d} (${F(R.bars.ap)} cm²)`,'As = '+F(R.Asr)+' cm²',''],['Armatures transversales',`cadres HA${R.Dt}, espacement ${R.st} cm`,'',''],['Recouvrement','lr = '+R.lr+' cm','','']]},{t:'p',s:'Ce document est une note de calcul assistée par ordinateur. Les hypothèses, les efforts et les dispositions constructives doivent être contrôlés par une personne compétente avant exécution.',c:'#555555'});return notePdfPages('NOTE DE CALCUL - POTEAU BAEL',bl)}
function cpc(){const g=PL().g;$('#cv2').innerHTML=`<div class="card">${sl('xct','Méthode',[['cen','Compression centrée avec flambement (B.8.4)'],['fc','Flexion composée (A.4.4)']],'cen')}
<div class="row">${inp('xcN','Nu, effort normal ELU (kN)',1500)}${inp('xcM','Mu, moment ELU (kN·m)',0)}</div>${sl('xcw','Poids propre du poteau',[[1,'Ajouté automatiquement'],[0,'Déjà compris dans Nu']],1)}
<div class="row">${inp('xcb','Largeur b (cm)',30)}${inp('xch','Hauteur h dans le plan de flexion (cm)',30)}</div>
<div class="row">${inp('xcl','Hauteur libre l0 (m)',3)}${sl('xck','Liaisons (lf = k·l0)',[['0.7','Poteau d’étage continu : 0,7'],['1','Articulé aux deux bouts : 1'],['0.5','Encastré aux deux bouts : 0,5'],['2','Encastré-libre : 2']],'0.7')}</div>
${sl('xca','Âge du béton à la mise en charge',[[1,'Plus de 90 jours'],[1.1,'28 à 90 jours'],[1.2,'Moins de 28 jours']],1)}
<div class="row">${sl('xcf','Béton fc28 (MPa)',[[20,'20'],[25,'25'],[30,'30'],[35,'35']],g.fc)}${sl('xce','Acier fe (MPa)',[[400,'400'],[500,'500']],g.fe)}</div>
<div class="row">${inp('xcc','Enrobage (cm)',3)}${sl('xcd','Ø longitudinales estimé (mm)',[[12,'12'],[14,'14'],[16,'16'],[20,'20'],[25,'25']],16)}</div><div id="ox"></div></div>
<p class="h">Référentiel : BAEL 91 révisé 99, section rectangulaire. En flexion composée, le moment est dans le plan de la hauteur h. Les poteaux à section circulaire, le biflexion et les poteaux de bâtiments contreventés par portiques sont à étudier avec le module d’analyse des structures.</p>`;opc()}
let PCR=null;
function opc(){const R=pcCalc();PCR=R;if(R.err){$('#ox').innerHTML=`<p class="warn">${R.err}</p>`;return}const F=(x,n)=>f(x,n==null?2:n);
$('#ox').innerHTML=`<div style="margin-top:12px"><div class="tot"><span><b>Armatures longitudinales</b></span><b>${R.bars.n} HA${R.bars.d}</b></div><p class="h" style="margin:0 0 6px">As = ${F(R.Asr)} cm² (minimum ${F(R.Amin)} cm², maximum ${F(R.Amax)} cm²) ; ${F(R.bars.ap)} cm² fournis</p>
<div class="tot"><span><b>Cadres</b></span><b>HA${R.Dt}, e = ${R.st} cm</b></div><p class="h" style="margin:0 0 6px">Recouvrement lr = ${R.lr} cm${R.cc?' ; λ = '+F(R.cc.lam,1)+', α = '+F(R.cc.al,3):''}</p>
${R.chk.map(x=>`<p class="h ${x.ok?'ok':'bad'}" style="margin:3px 0">${x.ok?'✓':'⚠'} ${x.t}</p>`).join('')}${R.warn.map(w=>`<p class="h bad" style="margin:3px 0">⚠ ${w}</p>`).join('')}
<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Détail du calcul, formules et références</summary>${R.steps.map(s=>`<p class="h" style="margin:6px 0"><b>${s[0]}</b><br>${s[1]}<br><b>${s[2]}</b> <span class="h">${s[3]?'('+s[3]+')':''}</span></p>`).join('')}</details></div>
<button class="btn" onclick="pcPdf()">Note de calcul en PDF</button><button class="btn sec" onclick="pcPlan()">Utiliser dans le plan du poteau</button>`}
function pcPdf(){if(!PCR||PCR.err){msg('Corrigez les données.');return}shareFile('Note-de-calcul-poteau-'+ymd()+'.pdf','application/pdf',buildPdf(pcNote(PCR)),'Note de calcul')}
function pcPlan(){const R=PCR;if(!R||R.err){msg('Corrigez les données.');return}Object.assign(PL().pot,{b:Math.round(R.b*100),h:Math.round(R.h*100),H:R.l0,c:Math.round(R.c*1000)/10,n:R.bars.n,dl:R.bars.d,dc:R.Dt,sa:Math.min(10,R.st),sc:R.st,lap:R.lr});save();logA('Armatures du calcul de poteau transférées vers le plan');pt='pot';cs='pl';ca();msg('Paramètres transférés : vérifiez le plan.')}

if((S.v||0)<2){S.v=2;save()}
