name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparer le projet Android
        run: |
          mkdir -p www assets
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png www/
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/share@7 @capacitor/filesystem@7
          npm i -D @capacitor/assets
          npx cap init Chantier360 com.chantier360.app --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' android/app/src/main/AndroidManifest.xml

      - name: Signature stable (pour pouvoir mettre a jour sans desinstaller)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chantier360.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Chantier360-apk
          path: Chantier360.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Chantier360 APK (build ${{ github.run_number }})
          files: Chantier360.apk
